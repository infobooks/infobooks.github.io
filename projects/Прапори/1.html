<!DOCTYPE html><html lang="uk"><meta charset="utf-8"><meta name="viewport"content="width=device-width,initial-scale=1.0"><link rel="stylesheet"href="https://infobooks.github.io/task.css"><canvas id="canvas1"width="400"height="300"></canvas><br><button onclick="f1()">Україна</button><button onclick="f2()">Японія</button><button onclick="f3()">Бразилія</button><button onclick="f4()">Чехія</button><script>function f1(){let c=canvas1.getContext('2d');c.beginPath();c.rect(20,20,150,50);c.fillStyle='blue';c.fill();c.beginPath();c.rect(20,70,150,50);c.fillStyle='yellow';c.fill();}function f2(){let c=canvas1.getContext('2d');c.beginPath();c.rect(200,20,150,100);c.stroke();c.fillStyle='white';c.fill();c.beginPath();c.arc(275,70,30,0,7);c.fillStyle='red';c.fill();}function f3(){let c=canvas1.getContext('2d');c.beginPath();c.rect(20,150,150,100);c.stroke();c.fillStyle='green';c.fill();c.beginPath();c.moveTo(30,200);c.lineTo(95,160);c.lineTo(160,200);c.lineTo(95,240);c.lineTo(30,200);c.fillStyle='yellow';c.fill();c.beginPath();c.arc(95,200,25,0,7);c.fillStyle='blue';c.fill();}function f4(){let c=canvas1.getContext('2d');c.beginPath();c.rect(200,150,150,50);c.stroke();c.fillStyle='white';c.fill();c.beginPath();c.rect(200,200,150,50);c.stroke();c.fillStyle='red';c.fill();c.beginPath();c.moveTo(200,150);c.lineTo(275,200);c.lineTo(200,250);c.fillStyle='blue';c.fill();}</script>
