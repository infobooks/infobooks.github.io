<img src="images.jpg" width="110">

 </div>

<div>
<img src="images (1).jpg" width="110">
<input type="radio" id="radio2" name="group1"> СУШІ (560 ГРН)
 </div>

<div>
<img src="images (2).jpg" width="120">
<input type="radio" id="radio3" name="group1"> ГОЛУБЦІ (125 ГРН)
 </div>

<input type="checkbox" id="checkbox1"> знижка -9%

<div> До сплати  <output id="output1"></output> грн  </div>


<div><button type="button" onclick="f1()">Обчислити</button></div>





<script>

function f1() {

let weight = Number(input1.value);

let price;

if (radio1.checked) price = 350;
if (radio2.checked) price = 560;
if (radio3.checked) price = 125;

let s = weight*price

if (checkbox1.checked) s = s * 1.09;

output1.value = s.toFixed(1);

}

</script>
