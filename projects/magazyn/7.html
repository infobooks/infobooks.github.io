<div> <img src="h.jpg" width="70">  <input  <input type="radio" id="radio3" name="group3">  Сирок "Агуня" (14,90)  </div>

<div><button type="button" onclick="f1()">Обчислити</button></div>





<script>

function f1() {
 let kilkist = Number(input1.value);
 
 let zina;
 if (radio1.checked) zina = 17.49;
 if (radio2.checked) zina = 16.00; 
 if (radio3.checked) zina = 14.90;
 
 let suma= zina * kilkist;
 
 
 output1.value = suma.toFixed(2) ;


}

</script>
