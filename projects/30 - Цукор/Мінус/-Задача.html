<h2><img src="цукор.jpg" width="80"> Цукор оптом <img src="цукор.jpg" width="80"></h2>
<h3> Вага </h3>
<img src="ukr.jpg" height="25"><input id="input1"> (кг)
<img src="usa.png" height="25"><output id="output1"></output> (фунти) <br>
Попередити при купівлі більше 100 кг <input type="checkbox" id="checkbox1"> <br>

<fieldset>
<input type="radio" id="radio1" name="group1">З буряку (33,29 грн) 
<input type="radio" id="radio2" name="group1">З тростини (126,36 грн) <br>
<input type="radio" id="radio3" name="group1">Рафінад (72,46 грн)
</fieldset>

Ваш вибір: цукор <output id="output2"></output> <br>
--------------------------------------------------------------------<br>
<input type="checkbox" id="checkbox2"> + податки (10 %) <br>
До оплати <output id="output3"></output> грн <br>

<button onclick="f1()">Обчислити</button>


<script> function f1() {
    let weightUkr = Number(input1.value);
	let weightUSA = weightUkr * 0.45359237;
    output1.value = weightUSA.toFixed(1);
    
    if (weightUkr > 100) alert('Увага! Ви купуєте більше 100 кг');
    
    let sugar = 'Ви не вибрали цукор!';
	if (radio1.checked) sugar = 'З буряку';
	if (radio2.checked) sugar = 'З тростини';
	if (radio3.checked) sugar = 'Рафінад';
	output2.value = sugar;
    
    let price = 0;
	if (radio1.checked) price = 33.29;
	if (radio2.checked) price = 126.36;
	if (radio3.checked) price = 72.46;
    let sum = weightUkr * price;
    
    if (checkbox2.checked) sum = sum * 1.1;
    
    output3.value = sum.toFixed(2);
} </script>
