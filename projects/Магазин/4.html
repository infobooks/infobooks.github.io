<!DOCTYPE html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://infobooks.github.io/task.css"><h1>Магазин "Веселка"</h1> <img src="веселка.jpg" width="100">
<div><b>Кількість</b>    <input id="input1">одиниці    </div><div><img src="мармелад.jpg" width="80"><input type="radio" id="radio1" name="group1">Мармелад (32 грн)</div><div><img src="шоколад.jpg" width="80"><input type="radio" id="radio2" name="group2">Шоколад (56 грн)</div><div><img src="торт.jpg" width="100"><input type="radio" id="radio3" name="group3">Торт (156 грн)</div><div><input type="checkbox" id="checkbox1">Доставка (+10%)</div><div><b> До оплати:</b>  <output id="output1"></output> грн  </div><div><button type="button" onclick="f1()">Обчислити</button> </div><script>function f1() {let nambe= Number(input1.value);let price;if(radio1.checked) price = 32;if(radio2.checked) price = 56;if(radio3.checked) price = 156;let sum = nambe*price;if(checkbox1.checked) sum= sum*1.10;output1.value =sum.toFixed(2);}</script>
