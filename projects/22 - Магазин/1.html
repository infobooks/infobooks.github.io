<!DOCTYPE html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><link rel="stylesheet" href="https://infobooks.github.io/task.css"><h2><img src="4.jpg"height="50"> «Для обраних» <img src="4.jpg" height="50"></h2><h3>Вага <input> кг</h3><fieldset><label><img src="1.jpg"height="50"> <input type="radio"id="radio1"name="group">ікра білуги-альбіноса (750 000 грн) </label><br><br><label><img src="2.jpg"height="50"> <input type="radio"id="radio2"name="group">мармурова яловичина (40 000 грн) </label><br><br><label><img src="3.jpg"height="50"> <input type="radio"id="radio3"name="group">кава з кишечника вівери (15 000 грн) </label><br></fieldset><input type="checkbox"id="checkbox1">з податками (+25%)<br><br>До оплати: <output id="output1"></output> грн<br><button onclick="f1()">Обчислити</button><script>function f1(){let weight=Number(input1.value);let price=0;if(radio1.checked)price=750000;if(radio2.checked)price=40000;if(radio3.checked)price=15000;let sum=weight*price;if(checkbox1.checked)sum=sum*1.25;output1.value=sum.toFixed(2);}</script>
