<!DOCTYPE html><html lang="uk"><meta charset="utf-8"><meta name="viewport"content="width=device-width,initial-scale=1.0"><link rel="stylesheet"href="https://infobooks.github.io/task.css"><h2>Земельний калькулятор</h2><output id="output1"></output><img src="Трикутник.jpg"width="100"><img src="Квадрат.jpg"width="100"><output id="output2"></output><br><br>Довжина паркану: <input id="input1"><br>
<button onclick="f1()">Порахувати</button><br><br><output id="output3"></output><img src="Шестикутник.jpg"width="100"><img src="Коло.jpg"width="100"><output id="output4"></output><script>function f1(){let P=Number(input1.value);let a;let R;a=P/3;let S3=a*a*Math.sqrt(3)/4;a=P/4;let S4=a*a;a=P/6;let S6=3*Math.sqrt(3)/2*a*a;R=P/(2*Math.PI);let S0=Math.PI*R*R;output1.value=S3.toFixed(1);output2.value=S4.toFixed(1);output3.value=S6.toFixed(1);output4.value=S0.toFixed(1);}</script>
