<!--================================-->
<style>
body {
  margin: 0;
  padding: 5px;
  text-align: center;
  font-family: sans-serif;
  color: #333333;
  background-color: #f5f4e5;
}
.task-content {
  margin: 5px;
  padding: 2px;
  max-width: 30em;
  line-height: 1.3;
  background-color: #ffffff;
}
@media screen and (min-width:30em) {
  .task-content {margin: 5px 10%}
}
.task-header {
  margin: 0;
  padding: 2px;
  display: flex;
  border-radius: 5px;
  line-height: 2;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  background-color: #8fbc8f;
}
.task-button {
  overflow: hidden;
  margin: 1px;
  padding: 2px 4px;
  width: 35px;
  border: 1px solid #333333;
  border-radius: 5px;
  background: linear-gradient(to bottom, #d0ecf4, #5bc9e1, #d0ecf4);
  cursor: pointer;
}
select {
  min-width: 120px;
  padding: 2px 5px;
  font-size: 1em;
  border: 2px outset #333333;
  border-radius: 5px;
  background: linear-gradient(to bottom, #ffffff, #b0c4de, #ffffff);  
}
.task-title {
  padding: 20px 0 10px 0;
}
.task-number {
  padding-right: 7px;
  font-weight: bold;
}
.task-container video {
  max-width: 100%;
  border-radius: 5px;
  border: 1px dotted #333333;
}
.task-text {
  padding: 15px 20px;
  text-align: left;
  line-height: 1.5;  
}
</style>

<!--================================-->
<body onload="Start(location.search)">

<div class="task-content">
  <div class="task-header">
    <div class="task-button" onclick="ShowItem(listBox.selectedIndex - 1)">&#9668;</div>
    <select id="listBox" size="1" onchange="ShowItem(this.selectedIndex)"></select>
    <div class="task-button" onclick="ShowItem(listBox.selectedIndex + 1)">&#9658;</div>
  </div>
  <div class="task-title">
    <span id="taskNumber" class="task-number"></span>
    <span id="taskName"></span>
  </div>
  <div class="task-container"><video id="taskVideo" controls><source src="" type="video/mp4"></video></div>
  <div id="taskText" class="task-text"></div>
</div>

</body>

<script>
var startX, startY;
var myList = document.getElementById('listBox');
var myNumber = document.getElementById('taskNumber');
var myName = document.getElementById('taskName');
var myVideo = document.getElementById('taskVideo');
var myText = document.getElementById('taskText');

//-------------------------------------
function Start(txt) {
  let s = '';
  for (let i = 0; i < a.length; i++) {
    s += '<option>' + (i + 1) + '</option>';
  }
  myList.innerHTML = s;
  
  const par = decodeURI(txt).trim().slice(1);
  let n = (par.length > 0 && !isNaN(par) && Number.isInteger(Number(par))) ? Number(par) - 1 : 0
  ShowItem(n);
}

//-------------------------------------
function ShowItem(n) {
  const SCRATCH_FOLDER = 'scratch/';

  if (a.length === 0) return;
  if (n >= a.length) n = a.length - 1;
  if (n < 0) n = 0;

  let task = tasks[a[n] - 1];

  myNumber.innerHTML = '№&nbsp;' + (n + 1) + '.';
  myName.innerHTML = task.name ?? 'Noname';
  if ('noView' in task) {
    myVideo.src = '';
    myVideo.style.display = 'none';
    myText.innerHTML = '';
    myText.style.display = 'none';  
  } else {

    myVideo.src = SCRATCH_FOLDER + a[n] + ' - ' + task.name + '.mp4';
    myVideo.style.display = '';
    if ('text' in task) {
      myText.innerHTML = task.text;
      myText.style.display = '';
    } else {
      myText.innerHTML = '';
      myText.style.display = 'none';  
    }
  }

  myList.selectedIndex = n;
}

//-------------------------------------
function touchStart() {
  startX = event.touches[0].clientX;
  startY = event.touches[0].clientY;
}
function touchEnd(n) {
  let dX = event.changedTouches[0].clientX - startX;
  let dY = event.changedTouches[0].clientY - startY;
  if (dX > 50 && Math.abs(dX) > Math.abs(dY)) ShowItem(n - 1);
  if (dX < -50 && Math.abs(dX) > Math.abs(dY)) ShowItem(n + 1);
}
