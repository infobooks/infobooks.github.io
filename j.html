<!DOCTYPE html>
<html lang="uk" ontouchstart="touchStart()" ontouchend="touchEnd(listBox.selectedIndex)">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Задачі (JavaScript)</title>

<!--================================-->
<style>
body {
  margin: 0;
  padding: 5px;
  font-family: "Arial", sans-serif;
  color: #333333;
  background-color: #f5f4e5;
}
.task-content {
  margin: 5px;
  padding: 2px;
  max-width: 30em;
  line-height: 1.5;
  background-color: #ffffff;
}
@media screen and (min-width:30em) {
  .task-content {margin: 5px 10%;}
}
.task-header {
  margin: 0;
  padding: 2px;
  display: flex;
  border-radius: 5px;
  line-height: 2;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  text-align: center;
  background-color: #8fbc8f;
}
.task-button {
  overflow: hidden;
  margin: 1px;
  padding: 2px 4px;
  width: 35px;
  border: 1px solid #333333;
  border-radius: 5px;
  background: linear-gradient(to bottom, #d0ecf4, #5bc9e1, #d0ecf4);
  cursor: pointer;
}
select {
  min-width: 120px;
  padding: 2px 5px;
  font-size: 1em;
  border: 2px outset #333333;
  border-radius: 5px;
  background: linear-gradient(to bottom, #ffffff, #b0c4de, #ffffff);
}
.task-main {
  padding: 5px;
}
.task-number {
  font-size: 0.9em;
  font-weight: bold;
  text-align: center;
}
.task-text {
  padding: 5px;
}
.task-hint {
  padding-bottom: 5px;
  font-size: 0.9em;
}
.task-in-out {
  padding: 5px;
  background-color: #fffff0;
  border: 1px dotted #333333;
}
.task-in-title, .task-out-title {
  padding: 5px 30px;
  font-size: 0.9em;
  font-style: italic;
  font-weight: bold;
}
.task-in, .task-out {
  padding: 5px 10px;
  font-size: 0.9em;
}
.task-container, .task-solve-container {
  text-align: center;
}
.task-container img, .task-solve-container img {
  max-width: 100%;
}
.task-tests {
  padding: 10px;
  font-family: monospace;
  background-color: #f8f8ff;
}
.task-tests table {
  border-spacing: 5px;
}
.task-tests td {
  min-width: 30px;
  padding: 2px 3px;
}
.task-solve {
  padding: 5px;
  border: 1px dotted #333333;
}
.taks-solve-title {
  padding: 5px;
  font-size: 0.9em;
  text-align: center;
  font-style: italic;
  font-weight: bold;
}
.my-css-style {
  margin: 5px;
  padding: 5px;
  text-align: center;
  font-size: 0.8em;
  border-top: 1px dotted #000000;
  line-height: 1.2;
}
</style>

<!--================================-->
<body onload="Start(location.search)">

<div class="task-content">
  <div class="task-header">
    <div class="task-button" onclick="ShowItem(listBox.selectedIndex - 1)">&#9668;</div>
    <select id="listBox" size="1" onchange="ShowItem(this.selectedIndex)"></select>
    <div class="task-button"onclick="ShowItem(listBox.selectedIndex + 1)">&#9658;</div>
  </div>

  <div class="task-main">
    <div id="taskNumber" class="task-number"></div>
    <div id="taskText" class="task-text"></div>
    <div id="taskHint" class="task-hint"></div>
    <div class="task-container"><img id="taskImage" src="" alt=""></div>
  </div>

  <div class="task-in-out">
    <div id="taskInTitle" class="task-in-title">Дано:</div>
    <div id="taskIn" class="task-in"></div>
    <div id="taskOutTitle" class="task-out-title">Результат:</div>
    <div id="taskOut" class="task-out"></div>
  </div>

  <div id="tasktests" class="task-tests">Тести</div>
  <div id="taskSolve" class="task-solve">
    <div class="taks-solve-title">Розв'язок</div>
    <div class="task-solve-container"><img id="taskSolveImage" src="" alt=""></div>
    <div class="my-css-style">Для красивого вигляду першим рядком запишіть:<br><br>
        &lt;link rel="stylesheet" href="https://infobooks.github.io/task.css"&gt;
    </div>
  </div>

</div>

</body>

<!--================================-->
<script>
var startX, startY;
var myList = document.getElementById('listBox');
var myNumber = document.getElementById('taskNumber');
var myText = document.getElementById('taskText');
var myIn = document.getElementById('taskIn');
var myInTitle = document.getElementById('taskInTitle');
var myOut = document.getElementById('taskOut');
var myOutTitle = document.getElementById('taskOutTitle');
var mytests = document.getElementById('tasktests');
var myHint = document.getElementById('taskHint');
var myImage = document.getElementById('taskImage');
var mySolve = document.getElementById('taskSolve');
var mySolveImage = document.getElementById('taskSolveImage');

//-------------------------------------
function Start(txt) {
  let s = '';
  for (let i = 0; i < a.length; i++) {
    s += '<option>' + (i + 1) + ('solve' in tasks[a[i] - 1] ? '°' : '') + '</option>';
  }
  myList.innerHTML = s;
  
  const par = decodeURI(txt).trim().slice(1);
  let n = (par.length > 0 && !isNaN(par) && Number.isInteger(Number(par))) ? Number(par) - 1 : 0;
  ShowItem(n);
}

//-------------------------------------
function ShowItem(n) {
  const JS_FOLDER = 'javascript/';

  if (a.length === 0) return;
  if (n >= a.length) n = a.length - 1;
  if (n < 0) n = 0;

  let task = tasks[a[n] - 1];
  
    //-----------------
  myNumber.innerHTML = '№&nbsp;' + (n + 1);
  if ('noView' in task) {
    myText.innerHTML = '';
    myText.style.display = 'none';  
    myIn.innerHTML = '';
    myIn.style.display = 'none';
    myInTitle.style.display = 'none';
    myOut.innerHTML = '';
    myOut.style.display = 'none';
    myOutTitle.style.display = 'none';
    mytests.innerHTML = '';
    mytests.style.display = 'none';
    myHint.innerHTML = '';
    myHint.style.display = 'none';
    myImage.src = '';
    myImage.style.display = 'none';
    mySolveImage.src = '';
    mySolve.style.display = 'none';
  } else {

    if ('text' in task) {
      myText.innerHTML = task.text;
      myText.style.display = '';
    } else {
      myText.innerHTML = '';
      myText.style.display = 'none';
    }
    if ('inTitle' in task) {
      myIn.innerHTML = task.inTitle.map((num, index) => `${index + 1}) ${num}`).join('<br>');
      myIn.style.display = '';
      myInTitle.style.display = '';
    } else {
      myIn.innerHTML = '';
      myIn.style.display = 'none';
      myInTitle.style.display = 'none';
    } 
    if ('outTitle' in task) {
      myOut.innerHTML = task.outTitle.map((num, index) => `${index + 1}) ${num}`).join('<br>');
      myOut.style.display = '';
      myOutTitle.style.display = '';
    } else {
      myOut.innerHTML = '';
      myOut.style.display = 'none';
      myOutTitle.style.display = 'none';
    }
    if ('tests' in task) {
      mytests.innerHTML = '<table>' + task.tests.map(row => '<tr>' + 
        row.map(item => `<td>${item}</td>`).join('') + '</tr>').join('') + '</table>';
      mytests.style.display = '';
    } else {
      mytests.innerHTML = '';
      mytests.style.display = 'none';
    }
    if ('hint' in task) {
      myHint.innerHTML = '(підказка: ' + task.hint + ')';
      myHint.style.display = '';
    } else {
      myHint.innerHTML = '';
      myHint.style.display = 'none';
    }
    if ('img' in task) {
      myImage.src = JS_FOLDER + a[n] + '.png';
      myImage.style.display = '';
    } else {
      myImage.src = '';
      myImage.style.display = 'none';
    }
    if ('solve' in task) {
      mySolveImage.src = JS_FOLDER + a[n] + ' - solve.png'
      mySolve.style.display = '';
    } else {
      mySolveImage.src = '';
      mySolve.style.display = 'none';
    }
  }
  
  myList.selectedIndex = n;
}

//-------------------------------------
function touchStart() {
  startX = event.touches[0].clientX;
  startY = event.touches[0].clientY;
}
function touchEnd(n) {
  let dX = event.changedTouches[0].clientX - startX;
  let dY = event.changedTouches[0].clientY - startY;
  if (dX > 50 && Math.abs(dX) > Math.abs(dY)) ShowItem(n - 1);
  if (dX < -50 && Math.abs(dX) > Math.abs(dY)) ShowItem(n + 1);
}
