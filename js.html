<html lang="uk" ontouchstart="touchStart()" ontouchend="touchEnd(listBox.selectedIndex)">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Задачі (JavaScript)</title>

<!--================================-->
<style>
  body {
    margin: 0;
    padding: 5px;
    font-family: 'Arial', sans-serif;
    color: #333333;
    background-color: #f5f4e5;
  }

  .task-content {
    margin: 5px;
    padding: 2px;
    max-width: 600px;
    line-height: 1.5;
    background-color: #ffffff;
  }

  @media screen and (min-width: 900px) {
    body {
      font-size: 18px;
    }

    .task-content {
      margin: 5px 120px;
    }
  }

  .task-header {
    margin: 0;
    padding: 2px;
    display: flex;
    border-radius: 5px;
    line-height: 2;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    text-align: center;
    background-color: #97d397;
  }

  .task-button {
    overflow: hidden;
    margin: 1px;
    padding: 2px 4px;
    width: 35px;
    border: 1px solid #333333;
    border-radius: 5px;
    background: linear-gradient(to bottom, #d0ecf4, #5bc9e1, #d0ecf4);
    cursor: pointer;
  }

  select {
    min-width: 120px;
    padding: 2px 5px;
    font-size: 1em;
    border: 2px outset #333333;
    border-radius: 5px;
    background: linear-gradient(to bottom, #ffffff, #b0c4de, #ffffff);
  }

  .task-main {
    padding: 10px 5px 5px 5px;
  }

  .task-number {
    padding-right: 7px;
    font-weight: bold;
  }

  .task-text {
    padding: 5px;
  }

  .task-hint {
    padding-bottom: 5px;
    font-size: 0.9em;
  }

  .task-in-out {
    padding: 5px;
    background-color: #fffff0;
    border: 1px dotted #333333;
  }

  .task-in-title,
  .task-out-title {
    padding: 5px 30px;
    font-size: 0.9em;
    font-style: italic;
    font-weight: bold;
  }

  .task-in,
  .task-out {
    padding: 5px 10px;
    font-size: 0.9em;
  }

  .task-container,
  .task-solve-container {
    max-width: 600px;
    margin: 0 auto;
    text-align: center;
  }

  .task-container img,
  .task-solve-container img {
    max-width: 100%;
    width: auto;
    height: auto;
    border-radius: 5px;
    border: 1px dotted #333333;
    object-fit: contain;
  }

  .task-tests {
    padding: 10px;
    font-family: 'Consolas', monospace;
    background-color: #f8f8ff;
  }

  .task-tests table {
    font-size: 0.8em;
    border-spacing: 5px;
  }

  .task-tests td {
    min-width: 30px;
    padding: 2px 3px;
    text-align: left;
    vertical-align: top;
  }

  .task-solve {
    padding: 5px;
  }

  .task-solve-title {
    padding: 7px;
    border-top: 1px dotted #333333;
    font-size: 0.9em;
    font-style: italic;
    text-align: center;
    font-weight: bold;
  }

  .my-css-style {
    margin: 2px;
    border-top: 1px dotted #333333;
    background-color: #f8f8ff;
    padding: 5px;
    font-size: 0.8em;
    line-height: 1.4;
  }

  input {
    margin: 2px 10px;
  }

  a {
    text-decoration: none;
    color: #992211;
  }
</style>

<!--================================-->

<body onload="Start(location.search)">

  <div class="task-content">
    <div class="task-header">
      <div class="task-button" onclick="ShowItem(listBox.selectedIndex - 1)">&#9668;</div>
      <select id="listBox" size="1" onchange="ShowItem(this.selectedIndex)"></select>
      <div class="task-button" onclick="ShowItem(listBox.selectedIndex + 1)">&#9658;</div>
    </div>

    <div class="task-main">
      <div class="task-text">
        <span class="task-number" id="taskNumber"></span>
        <span id="taskText"></span>
      </div>
      <div id="taskHint" class="task-hint"></div>
      <div class="task-container"><img id="taskImage" src="" alt=""></div>
    </div>

    <div class="task-in-out">
      <div id="taskInTitle" class="task-in-title">Дано:</div>
      <div id="taskIn" class="task-in"></div>
      <div id="taskOutTitle" class="task-out-title">Результат:</div>
      <div id="taskOut" class="task-out"></div>
    </div>

    <div id="taskTests" class="task-tests">Тести</div>
    <div id="taskSolveTitle" class="task-solve-title">
      <label><input type="checkbox" id="taskIsSolve" onclick="ViewSolve()">Розв'язок</label>
    </div>
    <div id="taskSolve" class="task-solve">
      <div class="task-solve-container"> <img id="taskSolveImage" src="" alt=""> </div>
      <div class="my-css-style">
        Для красивого вигляду першим рядком запишіть:<br>
        &lt;link rel="stylesheet" href= "https://infobooks.github.io/task.css"&gt;<br><br>
        Крім VSCode можна програмувати на&nbsp;онлайн-ресурсах:<br>
        1) <a href="https://w3schoolsua.github.io/htmltryit/tryhtml_default.html" target="_blank">W3SchoolsUA</a>
        2) <a href="https://jsfiddle.net/" target="_blank">JSFiddle</a>
        3) <a href="https://onecompiler.com/html" target="_blank">OneCompiler</a>
      </div>
    </div>
  </div>

</body>

<!--================================-->
<script>
  var startX, startY;
  var myList = document.getElementById('listBox');
  var myNumber = document.getElementById('taskNumber');
  var myText = document.getElementById('taskText');
  var myIn = document.getElementById('taskIn');
  var myInTitle = document.getElementById('taskInTitle');
  var myOut = document.getElementById('taskOut');
  var myOutTitle = document.getElementById('taskOutTitle');
  var myTests = document.getElementById('taskTests');
  var myHint = document.getElementById('taskHint');
  var myImage = document.getElementById('taskImage');
  var mySolve = document.getElementById('taskSolve');
  var myIsSolve = document.getElementById('taskIsSolve');
  var mySolveTitle = document.getElementById('taskSolveTitle');
  var mySolveImage = document.getElementById('taskSolveImage');

  var n = 0;
  const JS_FOLDER = 'js/';

  //-------------------------------------
  function Start(txt) {
    let s = '';
    let sign = '';
    for (let i = 0; i < tasks.length; i++) {
      sign = '';
      if ('solve' in tasks[i]) sign = '°';
      if (!('text' in tasks[i])) sign = ' -';
      s += '<option>' + (i + 1) + sign + '</option>';
    }
    myList.innerHTML = s;

    const par = decodeURI(txt).trim().slice(1);
    n = par.length > 0 && !isNaN(par) && Number.isInteger(Number(par)) ? Number(par) - 1 : 0;
    ShowItem(n);
  }

  //-------------------------------------
  function ViewSolve() {
    if (myIsSolve.checked) {
      mySolveImage.src = JS_FOLDER + 'js' + (n + 1) + '+.png';
      mySolve.style.display = '';
    } else {
      mySolveImage.src = '';
      mySolve.style.display = 'none';
    }
  }

  //-------------------------------------
  function ShowItem(num) {
    if (tasks.length === 0) return;
    n = num;
    if (n >= tasks.length) n = tasks.length - 1;
    if (n < 0) n = 0;

    let task = tasks[n];

    //-----------------
    myNumber.innerHTML = '№&nbsp;' + (n + 1) + '.';
    if ('noView' in task) {
      myText.innerHTML = 'Приховано!';
      myIn.innerHTML = '';
      myIn.style.display = 'none';
      myInTitle.style.display = 'none';
      myOut.innerHTML = '';
      myOut.style.display = 'none';
      myOutTitle.style.display = 'none';
      myTests.innerHTML = '';
      myTests.style.display = 'none';
      myHint.innerHTML = '';
      myHint.style.display = 'none';
      myImage.src = '';
      myImage.style.display = 'none';
      mySolveImage.src = '';
      mySolve.style.display = 'none';
    } else {
      if ('text' in task) {
        myText.innerHTML = task.text;
        myText.style.display = '';
      } else {
        myText.innerHTML = 'Приховано!';
      }
      if ('inTitle' in task) {
        myIn.innerHTML = task.inTitle.map((num, index) => `${index + 1}) ${num}`).join('<br>');
        myIn.style.display = '';
        myInTitle.style.display = '';
      } else {
        myIn.innerHTML = '';
        myIn.style.display = 'none';
        myInTitle.style.display = 'none';
      }
      if ('outTitle' in task) {
        myOut.innerHTML = task.outTitle.map((num, index) => `${index + 1}) ${num}`).join('<br>');
        myOut.style.display = '';
        myOutTitle.style.display = '';
      } else {
        myOut.innerHTML = '';
        myOut.style.display = 'none';
        myOutTitle.style.display = 'none';
      }
      if ('tests' in task) {
        myTests.innerHTML =
          '<table>' +
          task.tests.map((row) => '<tr>' + row.map((item) =>
            `<td>${Array.isArray(item) ? ('[' + item.join('; ') + ']') : String(item)}</td>`).join('') +
            '</tr>').join('') +
          '</table>';
        myTests.style.display = '';
      } else {
        myTests.innerHTML = '';
        myTests.style.display = 'none';
      }
      if ('hint' in task) {
        myHint.innerHTML = '(' + task.hint + ')';
        myHint.style.display = '';
      } else {
        myHint.innerHTML = '';
        myHint.style.display = 'none';
      }
      if ('img' in task) {
        myImage.src = JS_FOLDER + 'js' + (n + 1) + '.png';
        myImage.style.display = '';
      } else {
        myImage.src = '';
        myImage.style.display = 'none';
      }
      myIsSolve.checked = false;
      mySolveImage.src = '';
      mySolve.style.display = 'none';
      if ('solve' in task) {
        mySolveTitle.style.display = '';
      } else {
        mySolveTitle.style.display = 'none';
      }
    }

    myList.selectedIndex = n;
  }

  //-------------------------------------
  function touchStart() {
    startX = event.touches[0].clientX;
    startY = event.touches[0].clientY;
  }
  function touchEnd(n) {
    let dX = event.changedTouches[0].clientX - startX;
    let dY = event.changedTouches[0].clientY - startY;
    if (dX > 50 && Math.abs(dX) > Math.abs(dY)) ShowItem(n - 1);
    if (dX < -50 && Math.abs(dX) > Math.abs(dY)) ShowItem(n + 1);
  }

  //===================================== « »  ’  ?&nbsp;–
  const tasks = [
    // 1
    /* діап */
    {
      text: `Бабуся Олесі живе у Бобровиці. До якого типу належить цей населений пункт,
      якщо відома кількість жителів у ньому?`,
      hint: `до 10&nbsp;000 жителів&nbsp;– село,<br>
      від 10&nbsp;000 до 1&nbsp;000&nbsp;000 жителів&nbsp;– місто,<br>
      більше 1&nbsp;000&nbsp;000 жителів&nbsp;– мегаполіс`,

      inTitle: [
        `кількість жителів у Бобровиці`
      ],
      outTitle: [
        `тип населеного пункту`
      ],
      solve: true,

      tests: [
        [8560, '==>', 'село'],
        [12000, '==>', 'місто'],
        [1234500, '==>', 'мегаполіс'],
        [850678, '==>', 'місто'],
      ],
    },

    // 2
    /* цикл */
    {
      text: `Кожен вечір Микола завозить на склад 100&nbsp;кг зерна.
      Але за ніч третину постійно з’їдають миші.<br>
      Виведіть, як змінювалась вага зерна на складі протягом кількох днів (на ранок).`,

      inTitle: [
        `к-ть днів`
      ],
      outTitle: [
        `кілька чисел&nbsp;– вага зерна кожного ранку (виведіть у стовпчик)<br>
        + допишіть номер дня і «кг»`,
      ],
      solve: true,
      tests: [
        [5, '==>', '1.66.67кг 2.55.56кг 3.51.85кг 4.50.62кг 5.50.21кг'],
        [2, '==>', '1.66.67кг 2.55.56кг'],
      ],
    },

    // 3
    /* масив */
    {
      text: `На залізничну станцію прибув пасажирський поїзд з кількома вагонами.
      Микола знає кількість пасажирів у кожному вагоні.`,

      inTitle: [
        `масив чисел&nbsp;– к-ть пасажирів у кожному вагоні`
      ],
      outTitle: [
        `к-ть пасажирів у 2-му вагоні`,
        `к-ть вагонів`,
        `к-ть пасажирів у кожному вагоні (виведіть у стовпчик)`,
      ],
      solve: true,
      tests: [
        [[4, 13, 7, 55], '==>', 13, 4, [4, 13, 7, 55]],
        [[3, 1], '==>', 1, 2, [3, 1]],
      ],
    },

    // 4
    /* масив */
    {
      text: `На залізничну станцію прибув пасажирський поїзд з кількома вагонами.
      Микола знає кількість пасажирів у кожному вагоні.<br>
      a) Усі пасажири 2-го і 5-го вагона вийшли погуляти.<br>
      б) Чверть пасажирів 3-го вагона перейшла в інший вагон.<br>
      в) Начальник поїзда каже, що місяць тому вагонів було у 3&nbsp;рази більше.`,

      inTitle: [
        `масив чисел&nbsp;– к-ть пасажирів у кожному вагоні`
      ],
      outTitle: [
        `к-ть пасажирів, що вийшли погуляти`,
        `к-ть пасажирів, що залишились у 3-му вагоні`,
        `к-ть вагонів, яка була місяць тому`,
        `к-ть пасажирів у передостанньому вагоні`,
      ],
      tests: [
        [[12, 27, 16, 8, 1, 9, 3], '==>', 28, 12, 21, 9],
        [[3, 1, 9, 0, 8], '==>', 9, 6.75, 12, 0],
      ],
    },

    // 5
    /* масив */
    {
      text: `На залізничну станцію прибув пасажирський поїзд з кількома вагонами.
      Микола знає кількість пасажирів у кожному вагоні.
      Його цікавить, у якому з вагонів&nbsp;– 1-му чи 4-му&nbsp;– більше пасажирів?`,

      inTitle: [
        `масив чисел&nbsp;– к-ть пасажирів у кожному вагоні`
      ],
      outTitle: [
        `у якому вагоні більше пасажирів`
      ],
      solve: true,
      tests: [
        [[2, 27, 16, 8], '==>', 'У 4-му'],
        [[3, 1, 9, 0, 8], '==>', 'У 1-му'],
        [[10, 4, 12, 10, 5, 9], '==>', 'Порівну'],
      ],
    },

    // 6
    /* масив */
    {
      text: `Олеся працює у фірмі «Сонечко» і знає початкові доходи фірми за останні кілька місяців.
      Спонсори подвоїли усі гроші. Як тепер «виглядають» доходи?`,

      inTitle: [
        `масив чисел&nbsp;– початкові доходи фірми`
      ],
      outTitle: [
        `масив чисел&nbsp;– теперішні доходи фірми<br>
        + допишіть «грн» і номер місяця<br>
        + виведіть доходи тільки з 2-го по 5-ий місяць`
      ],
      solve: true,
      tests: [
        [[4, 2, 7, 1, 5, 13, 12, 7, 11], '==>', ['2. 4грн', '3. 14грн', '4. 2грн', '5. 10грн']],
        [[3, 1, 0, 100, 34, 9], '==>', ['2. 2грн', '3. 0грн', '4. 200грн', '5. 68грн']],
      ],
    },

    // 7
    /* масив */
    {
      text: `Олеся працює у фірмі «Сонечко» і знає початкові доходи фірми за останні кілька місяців.
      Хакери «вкрали» усі доходи за останні кілька місяців. Як тепер «виглядають» доходи?`,

      inTitle: [
        `масив чисел&nbsp;– початкові доходи фірми`,
        `місяць, після якого усі доходи зникли`
      ],
      outTitle: [
        `масив чисел&nbsp;– теперішні доходи фірми`
      ],
      tests: [
        [[12, 27, 6, 8, 1, 9, 3], 3, '==>', [12, 27, 6, 0, 0, 0, 0]],
        [[7, 9, 9, 11], 3, '==>', [7, 9, 9, 0]],
        [[3, 1, 9, 8], 1, '==>', [3, 0, 0, 0]],
        [[5, 5, 8, 9, 10], 5, '==>', [5, 5, 8, 9, 10]],
      ],
    },

    // 8
    /* масив */
    {
      text: `Олеся працює у фірмі «Сонечко» і знає початкові доходи фірми за останні кілька місяців.
      А як «виглядають» доходи по парних місяцях?`,

      inTitle: [
        `масив чисел&nbsp;– початкові доходи фірми`
      ],
      outTitle: [
        `масив чисел&nbsp;– доходи фірми по парних місяцях`
      ],
      tests: [
        [[12, 27, 6, 8, 1, 9, 3], '==>', [27, 8, 9]],
        [[3, 1, 9, 0], '==>', [1, 0]],
        [[25], '==>', []],
      ],
    },

    // 9
    /* масив */
    {
      text: `У журналі записані оцінки учнів 6-А за семестр з математики.
      А чи отримав хтось 12&nbsp;балів?`,

      inTitle: [
        `масив чисел&nbsp;– оцінки з математики`
      ],
      outTitle: [
        `номер якого-небудь учня з 12-ма балами<br>
        + виведіть «Ніхто не отримав&nbsp;12», якщо такого учня немає :(`,
      ],
      tests: [
        [[3, 12, 5, 9, 1, 12, 9], '==>', '2 (або 6)'],
        [[4, 7, 12], '==>', '3'],
        [[5, 9, 9, 11, 9, 9], '==>', 'Ніхто не отримав 12'],
      ],
    },

    // 10
    /* масив */
    {
      text: `У журналі записані оцінки учнів 6-А за семестр з математики.
      Микола вводить яку-небудь оцінку і хоче знати, скільки учнів її отримали?`,

      inTitle: [
        `масив чисел&nbsp;– оцінки з математики`,
        `оцінка, яку шукає Микола`
      ],
      outTitle: [
        `к-ть учнів із заданою оцінкою`
      ],
      solve: true,
      tests: [
        [[9, 1, 9, 3, 9, 9], 9, '==>', 4],
        [[7, 11], 9, '==>', 0],
        [[3, 7, 7, 12], 7, '==>', 2],
        [[5, 5, 8, 9, 11], 11, '==>', 1],
      ],
    },

    // 11
    /* масив */
    {
      text: `У журналі записані оцінки учнів 6-А за семестр з математики.
      Хто з учнів отримав оцінку початкового рівня (1-3 бали)?`,

      inTitle: [
        `масив чисел&nbsp;– оцінки з математики`
      ],
      outTitle: [
        `масив чисел&nbsp;– оцінки початкового рівня<br>
        + виведіть номери учнів і букву «б»`
      ],
      tests: [
        [[3, 2, 7, 8, 3, 8, 4, 1], '==>', ['1. 3б', '2. 2б', '5. 3б', '8. 1б']],
        [[12, 5, 2], '==>', ['3. 2б']],
        [[3, 7, 7, 12], '==>', ['1. 3б']],
        [[5, 4, 9], '==>', []],
      ],
    },

    // 12
    /* масив */
    {
      text: `У журналі записані оцінки учнів 6-А за семестр з математики.
      Хто отримава оцінку від 3 до 6 включно (номери)? Скільки таких учнів?`,

      inTitle: [
        `масив чисел&nbsp;– оцінки з математики`
      ],
      outTitle: [
        `масив чисел&nbsp;– номери учнів з оцінкою [3;&nbsp;6]`,
        `к-ть учнів з оцінкою [3;&nbsp;6]`
      ],
      tests: [
        [[10, 3, 7, 11, 11, 5], '==>', [2, 6], 2],
        [[12, 1, 1], '==>', [], 0],
        [[5, 4, 6, 6, 3], '==>', [5, 4, 6, 6, 3], 5],
      ],
    },

    // 13
    /* приклад */
    {
      text: `Обчисліть значення математичного прикладу.`,

      img: true,
      outTitle: [
        `значення прикладу`
      ],
      solve: true,
      tests: [
        [' ', '==>', 3.62857]
      ],
    },

    // 14
    /* приклад */
    {
      text: `Обчисліть значення математичного прикладу.`,

      img: true,
      outTitle: [
        `значення прикладу`
      ],
      tests: [
        [' ', '==>', -9.94]
      ],
    },

    // 15
    /* приклад */
    {
      text: `Обчисліть значення математичних прикладів.`,

      img: true,
      outTitle: [
        `значення прикладу-1`,
        `значення прикладу-2`
      ],
      tests: [
        [' ', '==>', -1090.8],
        [' ', '==>', 0.6313],
      ],
    },

    // 16
