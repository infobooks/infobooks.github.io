<html lang="uk" ontouchstart="touchStart()" ontouchend="touchEnd(listBox.selectedIndex)">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Задачі (JavaScript)</title>

<!--================================-->
<style>
  body {
    margin: 0;
    padding: 5px;
    font-family: 'Arial', sans-serif;
    color: #333333;
    background-color: #f5f4e5;
  }

  .task-content {
    margin: 5px;
    padding: 2px;
    max-width: 600px;
    line-height: 1.5;
    background-color: #ffffff;
  }

  @media screen and (min-width: 900px) {
    body {
      font-size: 18px;
    }

    .task-content {
      margin: 5px 120px;
    }
  }

  .task-header {
    margin: 0;
    padding: 2px;
    display: flex;
    border-radius: 5px;
    line-height: 2;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    text-align: center;
    background-color: #97d397;
  }

  .task-button {
    overflow: hidden;
    margin: 1px;
    padding: 2px 4px;
    width: 35px;
    border: 1px solid #333333;
    border-radius: 5px;
    background: linear-gradient(to bottom, #d0ecf4, #5bc9e1, #d0ecf4);
    cursor: pointer;
  }

  select {
    min-width: 120px;
    padding: 2px 5px;
    font-size: 1em;
    border: 2px outset #333333;
    border-radius: 5px;
    background: linear-gradient(to bottom, #ffffff, #b0c4de, #ffffff);
  }

  .task-main {
    padding: 10px 5px 5px 5px;
  }

  .task-number {
    padding-right: 7px;
    font-weight: bold;
  }

  .task-text {
    padding: 5px;
  }

  .task-hint {
    padding-bottom: 5px;
    font-size: 0.9em;
  }

  .task-in-out {
    padding: 5px;
    background-color: #fffff0;
    border: 1px dotted #333333;
  }

  .task-in-title,
  .task-out-title {
    padding: 5px 30px;
    font-size: 0.9em;
    font-style: italic;
    font-weight: bold;
  }

  .task-in,
  .task-out {
    padding: 5px 10px;
    font-size: 0.9em;
  }

  .task-container,
  .task-solve-container {
    max-width: 600px;
    margin: 0 auto;
    text-align: center;
  }

  .task-container img,
  .task-solve-container img {
    max-width: 100%;
    width: auto;
    height: auto;
    border-radius: 5px;
    border: 1px dotted #333333;
    object-fit: contain;
  }

  .task-tests {
    padding: 10px;
    font-family: 'Consolas', monospace;
    background-color: #f8f8ff;
  }

  .task-tests table {
    font-size: 0.8em;
    border-spacing: 5px;
  }

  .task-tests td {
    min-width: 30px;
    padding: 2px 3px;
    text-align: left;
    vertical-align: top;
  }

  .task-solve {
    padding: 5px;
  }

  .task-solve-title {
    padding: 7px;
    border-top: 1px dotted #333333;
    font-size: 0.9em;
    font-style: italic;
    text-align: center;
    font-weight: bold;
  }

  .task-comment {
    margin: 2px;
    border-top: 1px dotted #333333;
    background-color: #f8f8ff;
    padding: 5px;
    font-size: 0.8em;
    line-height: 1.4;
  }

  input {
    margin: 2px 10px;
  }

  a {
    text-decoration: none;
    color: #992211;
  }
</style>

<!--================================-->

<body onload="Start(location.search)">

  <div class="task-content">

    <div class="task-header">
      <div class="task-button" onclick="ShowItem(listBox.selectedIndex - 1)">&#9668;</div>
      <select id="listBox" size="1" onchange="ShowItem(this.selectedIndex)"></select>
      <div class="task-button" onclick="ShowItem(listBox.selectedIndex + 1)">&#9658;</div>
    </div>

    <div class="task-main">
      <div class="task-text">
        <span class="task-number" id="taskNumber"></span>
        <span id="taskText"></span>
      </div>
      <div id="taskHint" class="task-hint"></div>
      <div class="task-container"><img id="taskImage" src="" alt=""></div>
    </div>

    <div class="task-in-out">
      <div id="taskInTitle" class="task-in-title">Дано:</div>
      <div id="taskIn" class="task-in"></div>
      <div id="taskOutTitle" class="task-out-title">Результат:</div>
      <div id="taskOut" class="task-out"></div>
    </div>

    <div id="taskTests" class="task-tests">Тести</div>
    <div id="taskSolveTitle" class="task-solve-title">
      <label><input type="checkbox" id="taskIsSolve" onclick="ViewSolve()">Розв'язок</label>
    </div>
    <div id="taskSolve" class="task-solve">
      <div class="task-solve-container"> <img id="taskSolveImage" src="" alt=""> </div>
    </div>
    <div id="taskComment" class="task-comment">
      Для красивого вигляду першим рядком запишіть:<br>
      &lt;link rel="stylesheet" href= "https://infobooks.github.io/task.css"&gt;<br><br>
      Крім VSCode можна програмувати на&nbsp;онлайн-ресурсах:<br>
      1) <a href="https://w3schoolsua.github.io/htmltryit/tryhtml_default.html" target="_blank">W3SchoolsUA</a>
      2) <a href="https://jsfiddle.net/" target="_blank">JSFiddle</a>
      3) <a href="https://onecompiler.com/html" target="_blank">OneCompiler</a>
    </div>

  </div>

</body>

<!--================================-->
<script>
  var startX, startY;
  var myList = document.getElementById('listBox');
  var myNumber = document.getElementById('taskNumber');
  var myText = document.getElementById('taskText');
  var myIn = document.getElementById('taskIn');
  var myInTitle = document.getElementById('taskInTitle');
  var myOut = document.getElementById('taskOut');
  var myOutTitle = document.getElementById('taskOutTitle');
  var myTests = document.getElementById('taskTests');
  var myHint = document.getElementById('taskHint');
  var myImage = document.getElementById('taskImage');
  var mySolve = document.getElementById('taskSolve');
  var myIsSolve = document.getElementById('taskIsSolve');
  var mySolveTitle = document.getElementById('taskSolveTitle');
  var mySolveImage = document.getElementById('taskSolveImage');
  var myComment = document.getElementById('taskComment');

  var n = 0;
  //-------------------------------------
  function Start(txt) {
    let s = '';
    let sign = '';
    for (let i = 0; i < tasks.length; i++) {
      sign = '';
      if ('notSolve' in tasks[i]) sign = '*';
      if (!('text' in tasks[i])) sign = ' -';
      s += '<option>' + (i + 1) + sign + '</option>';
    }
    myList.innerHTML = s;

    const par = decodeURI(txt).trim().slice(1);
    n = 0;
    if (par.length > 0 && !(isNaN(par)) && Number.isInteger(Number(par))) {
      n = Number(par) - 1;
    }
    ShowItem(n);
  }

  //-------------------------------------
  function ViewSolve() {
    if (myIsSolve.checked) {
      mySolveImage.src = 'js+/js' + (n + 1) + '+' + '.png';
      mySolve.style.display = '';
    } else {
      mySolveImage.src = '';
      mySolve.style.display = 'none';
    }
  }

  //-------------------------------------
  function ShowItem(num) {
    if (tasks.length === 0) return;
    n = num;
    if (n >= tasks.length) n = tasks.length - 1;
    if (n < 0) n = 0;

    let task = tasks[n];

    //-----------------
    myNumber.innerHTML = '№&nbsp;' + (n + 1) + '.';
    if ('noView' in task) {
      myText.innerHTML = 'Приховано!';
      myIn.innerHTML = '';
      myIn.style.display = 'none';
      myInTitle.style.display = 'none';
      myOut.innerHTML = '';
      myOut.style.display = 'none';
      myOutTitle.style.display = 'none';
      myTests.innerHTML = '';
      myTests.style.display = 'none';
      myHint.innerHTML = '';
      myHint.style.display = 'none';
      myImage.src = '';
      myImage.style.display = 'none';
      mySolveImage.src = '';
      mySolve.style.display = 'none';
    } else {
      if ('text' in task) {
        myText.innerHTML = task.text;
        myText.style.display = '';
      } else {
        myText.innerHTML = 'Приховано!';
      }
      if ('inTitle' in task) {
        myIn.innerHTML = task.inTitle.map((num, index) => `${index + 1}) ${num}`).join('<br>');
        myIn.style.display = '';
        myInTitle.style.display = '';
      } else {
        myIn.innerHTML = '';
        myIn.style.display = 'none';
        myInTitle.style.display = 'none';
      }
      if ('outTitle' in task) {
        myOut.innerHTML = task.outTitle.map((num, index) => `${index + 1}) ${num}`).join('<br>');
        myOut.style.display = '';
        myOutTitle.style.display = '';
      } else {
        myOut.innerHTML = '';
        myOut.style.display = 'none';
        myOutTitle.style.display = 'none';
      }
      if ('tests' in task) {
        myTests.innerHTML =
          '<table>' +
          task.tests.map((row) => '<tr>' + row.map((item) =>
            `<td>${Array.isArray(item) ? ('[' + item.join('; ') + ']') : String(item)}</td>`).join('') +
            '</tr>').join('') +
          '</table>';
        myTests.style.display = '';
      } else {
        myTests.innerHTML = '';
        myTests.style.display = 'none';
      }
      if ('hint' in task) {
        myHint.innerHTML = '(' + task.hint + ')';
        myHint.style.display = '';
      } else {
        myHint.innerHTML = '';
        myHint.style.display = 'none';
      }
      if ('img' in task) {
        myImage.src = 'js/js' + (n + 1) + '.png';
        myImage.style.display = '';
      } else {
        myImage.src = '';
        myImage.style.display = 'none';
      }
      myIsSolve.checked = false;
      mySolveImage.src = '';
      mySolve.style.display = 'none';
      if ('notSolve' in task) {
        mySolveTitle.style.display = 'none';
      } else {
        mySolveTitle.style.display = '';
      }
    }

    myList.selectedIndex = n;
  }

  //-------------------------------------
  function touchStart() {
    startX = event.touches[0].clientX;
    startY = event.touches[0].clientY;
  }
  function touchEnd(n) {
    let dX = event.changedTouches[0].clientX - startX;
    let dY = event.changedTouches[0].clientY - startY;
    if (dX > 50 && Math.abs(dX) > Math.abs(dY)) ShowItem(n - 1);
    if (dX < -50 && Math.abs(dX) > Math.abs(dY)) ShowItem(n + 1);
  }

  //===================================== « »  ’  ?&nbsp;–
  const tasks = [

    // +++++++++++++ 7 - 1 +++++++++++++++++++++++++++++++
    // +++++++++++++++++++++++++++++++++++++++++++++++++++

    /* приклад */
    {
      text: `Обчисліть значення математичного прикладу.`,

      img: true,
      outTitle: [
        `значення прикладу`
      ],
      tests: [
        ['&nbsp;', '==>', 3.62857],
      ],
    },

    /* приклад */
    {
      text: `Обчисліть значення математичного прикладу.`,

      img: true,
      outTitle: [
        `значення прикладу`
      ],
      tests: [
        ['&nbsp;', '==>', 21.46],
      ],
    },

    /* приклад */
    {
      text: `Обчисліть значення математичних прикладів.`,

      img: true,
      outTitle: [
        `значення прикладу-1`,
        `значення прикладу-2`
      ],
      tests: [
        ['&nbsp;', '==>', -1090.8],
        ['&nbsp;', '==>', 0.6313],
      ],
    },

    /* приклад */
    {
      text: `Обчисліть значення математичних прикладів.`,

      img: true,
      outTitle: [
        `значення прикладу-1`,
        `значення прикладу-2<br>
        ** розв'яжіть, створивши 2&nbsp;кнопки і 1&nbsp;поле для обчислення (output)`
      ],
      tests: [
        ['&nbsp;', '==>', 0.974],
        ['&nbsp;', '==>', 19.5833],
      ],
    },

    /* лін */
    {
      text: `Микола привіз на склад меблів декілька столів та стільців.<br>
      Скільки всього предметів привіз Микола?`,

      inTitle: [
        `кількість столів`,
        `кількість стільців`
      ],
      outTitle: [
        `всього предметів`
      ],
      tests: [
        [17, 6, '==>', 23],
        [41, 40, '==>', 81],
      ],
    },

    /* лін */
    {
      text: `Олеся впевнена, що «ідеальна» вага людини в кілограмах&nbsp;–
      це її ріст у сантиметрах мінус 110.<br>
      Олеся знає свій ріст. Яка її «ідеальна» вага?`,

      inTitle: [
        `ріст Олесі (см)`
      ],
      outTitle: [
        `«ідеальна» вага Олесі (кг)`
      ],
      tests: [
        [217, '==>', 107],
        [174, '==>', 64],
      ],
    },

    /* лін */
    {
      text: `Микола зігнув дріт у формі квадрата.<br>
      Скільки дроту витратив Микола? Яку площу займає такий квадрат?`,

      inTitle: [
        `довжина однієї сторони квадрата`
      ],
      outTitle: [
        `довжина усього дроту`,
        `площа квадрата`
      ],
      tests: [
        [6.2, '==>', 24.8, 38.44],
        [17, '==>', 68, 289],
      ],
    },

    /* лін */
    {
      text: `Олеся купила телевізор. На коробці телевізора записана довжина діагоналі (у дюймах).<br>
      Cкільки це сантиметрів? А метрів?`,
      hint: `1 дюйм = 2,54 см`,

      inTitle: [
        `довжина діагоналі у дюймах`
      ],
      outTitle: [
        `довжина у см`,
        `довжина у метрах`
      ],
      tests: [
        [42, '==>', 106.68, 1.0668],
        [10.3, '==>', 26.16, 0.2616],
      ],
    },

    /* лін */
    {
      text: `Відомо, скільки днів пропрацював на орбіті космічний телескоп «Хаббл».
      А скільки це років?`,

      inTitle: [
        `кількість днів`
      ],
      outTitle: [
        `кількість років`
      ],
      tests: [
        [1000, '==>', 2.740],
        [56, '==>', 0.153],
      ],
    },

    /* лін */
    {
      text: `Олеся і Микола отримали перше і друге місця на олімпіаді з інформатики.<br>
      Обчисліть їхній середній бал. Скільки балів не вистачило Миколі, щоб стати першим?`,

      inTitle: [
        `бали Олесі`,
        `бали Миколи`
      ],
      outTitle: [
        `середній бал`,
        `перевага у балах Олесі над Миколою`
      ],
      tests: [
        [32, 20, '==>', 26.0, 12],
        [54, 31, '==>', 42.5, 23],
      ],
    },

    /* лін */
    {
      text: `Найповільніша тварина у світі равлик намагається «здолати» город Олесі.
      Відомо, скільки сантиметрів за хвилину проповзає в середньому равлик.<br>
      За скільки годин равлик проповзе через город Олесі?`,

      inTitle: [
        `довжина городу (у метрах)`,
        `швидкість равлика (см за хвилину)`
      ],
      outTitle: [
        `кількість <b>годин</b>, яку «витратить» равлик`
      ],
      tests: [
        [25, 9, '==>', 4.6],
        [125, 86, '==>', 2.4],
      ],
    },

    /* ф-ли */
    {
      text: `Обчисліть значення математичного виразу за заданими значеннями <b>a</b> та <b>b</b> .`,

      img: true,
      inTitle: [
        `<b>a</b>`,
        `<b>b</b>`
      ],
      outTitle: [
        `<b>r</b>&nbsp;– значення виразу`
      ],
      tests: [
        [2.4, -12, '==>', -1.56],
        [-5, 40.2, '==>', -18.07],
      ],
    },

    /* ф-ли */
    {
      text: `Обчисліть нову ціну продукту, який подорожчав на задану кількість відсотків.`,

      img: true,
      inTitle: [
        `<b>c</b>&nbsp;– стара ціна продукту`,
        `<b>v</b>&nbsp;– відсоток здорожчання`
      ],
      outTitle: [
        `<b>m</b>&nbsp;– нова ціна продукту`
      ],
      tests: [
        [52.45, 15, '==>', 60.32],
        [112.2, 5.5, '==>', 118.37],
      ],
    },

    /* ф-ли */
    {
      text: `Обчисліть об’єм кулі із заданим діаметром.`,

      img: true,
      inTitle: [
        `<b>d</b>&nbsp;– діаметр кулі`
      ],
      outTitle: [
        `<b>V</b>&nbsp;– об’єм кулі`
      ],
      tests: [
        [22.6, '==>', 6040.929],
        [15, '==>', 1766.250],
      ],
    },

    /* ф-ли */
    {
      text: `Обчисліть діюче значення сили струму у паралельно з’єднаних провідниках із заданими опорами.`,

      img: true,
      inTitle: [
        `<b>R<sub>1</sub></b>&nbsp;– опір 1-го провідника`,
        `<b>R<sub>2</sub></b>&nbsp;– опір 2-го провідника`
      ],
      outTitle: [
        `<b>I</b>&nbsp;– діюче значення сили струму`
      ],
      tests: [
        [34.7, 40, '==>', 8.78],
        [13, 21.3, '==>', 20.21],
      ],
    },

    /* ф-ли */
    {
      text: `Обчисліть значення математичних виразів за заданими значеннями <b>x</b> та <b>y</b> .`,

      img: true,
      inTitle: [
        `<b>x</b>`,
        `<b>y</b>`
      ],
      outTitle: [
        `<b>h</b>&nbsp;– значення виразу-1`,
        `<b>F</b>&nbsp;– значення виразу-2`
      ],
      tests: [
        [2.4, -12, '==>', 0.5230, -12.4862],
        [-5, 0.2, '==>', 32.8805, -0.2694],
      ],
    },

    /* ф-ли */
    {
      text: `Олеся прочитала на лампочці її потужність (енегроспоживання).<br>
      А який електричний опір цієї лампочки?`,

      img: true,
      inTitle: [
        `<b>P</b>&nbsp;– потужність лампочки (Вт)`,
        `<b>U</b>&nbsp;– напруга у мережі (В)`
      ],
      outTitle: [
        `<b>R</b>&nbsp;– електричний опір лампочки (Ом)`
      ],
      tests: [
        [7, 230, '==>', 7557.1],
        [100, 35, '==>', 12.3],
      ],
    },

    /* лін */
    {
      text: `Складіть програму, яка переводить байти в біти та кілобайти.`,

      inTitle: [
        `кількість байт`
      ],
      outTitle: [
        `кількість біт`,
        `кількість кілобайт`
      ],
      tests: [
        [346, '==>', 2768, 0.338],
        [12555, '==>', 100440, 12.261],
      ],
    },

    /* лін */
    {
      text: `Микола за тиждень споживає 19&nbsp;кг картоплі.
      Відомо, скільки картоплі зберігається в Миколи у льосі.<br>
      На скільки тижнів її вистачить? А скільки це днів?`,

      inTitle: [
        `вага усієї картоплі у льосі`
      ],
      outTitle: [
        `кількість тижнів`,
        `кількість днів`
      ],
      tests: [
        [254, '==>', 13.368, 93.6],
        [78, '==>', 4.105, 28.7],
      ],
    },

    /* лін */
    {
      text: `Відомо, за скільки годин з’їдають копицю сіна окремо коза, корова і кінь.<br>
      А за скільки годин цю ж копицю сіна з’їдять усі тварини разом?`,

      inTitle: [
        `час кози`,
        `час корови`,
        `час коня`
      ],
      outTitle: [
        `час, за який тварини з’їдять копицю разом`
      ],
      tests: [
        [4, 3, 2, '==>', 0.923],
        [27, 35, 40, '==>', 11.036],
      ],
    },

    /* ф-ли-const */
    {
      text: `Микола хоче наповнити бочку водою. Він виміряв діаметр основи та висоту бочки.<br>
      Який радіус основи бочки? А скільки літрів води вмістить така бочка?`,

      img: true,
      inTitle: [
        `<b>d</b>&nbsp;– діаметр основи бочки (см)`,
        `<b>H</b>&nbsp;– висота бочки (см)`
      ],
      outTitle: [
        `<b>R</b>&nbsp;– радіус основи (см)`,
        `<b>V</b>&nbsp;– кількість літрів води, яку вмістить бочка (л)`
      ],
