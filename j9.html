<!DOCTYPE html>
<html lang="uk" ontouchstart="touchStart()" ontouchend="touchEnd(listBox.selectedIndex)">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Задачі (JavaScript)</title>

<!--================================-->
<style>
body {
  margin: 0;
  padding: 5px;
  font-family: "Arial", sans-serif;
  font-size: '';
  color: #333333;
  background-color: #f5f4e5;
}
.task-content {
  margin: 5px;
  padding: 2px;
  max-width: 600px;
  line-height: 1.5;
  background-color: #ffffff;
}
@media screen and (min-width:900px) {
  body {font-size: 18px}
  .task-content {margin: 5px 120px}
}
.task-header {
  margin: 0;
  padding: 2px;
  display: flex;
  border-radius: 5px;
  line-height: 2;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  text-align: center;
  background-color: #8fbc8f;
}
.task-button {
  overflow: hidden;
  margin: 1px;
  padding: 2px 4px;
  width: 35px;
  border: 1px solid #333333;
  border-radius: 5px;
  background: linear-gradient(to bottom, #d0ecf4, #5bc9e1, #d0ecf4);
  cursor: pointer;
}
select {
  min-width: 120px;
  padding: 2px 5px;
  font-size: 1em;
  border: 2px outset #333333;
  border-radius: 5px;
  background: linear-gradient(to bottom, #ffffff, #b0c4de, #ffffff);
}
.task-main {
  padding: 5px;
}
.task-title {
  padding: 20px 0 10px 0;
  text-align: center;
}
.task-number {
  padding-right: 7px;
  font-weight: bold;
}
.task-name {}
.task-text {
  padding: 5px;
}
.task-hint {
  padding-bottom: 5px;
  font-size: 0.9em;
}
.task-in-out {
  padding: 5px;
  background-color: #fffff0;
  border: 1px dotted #333333;
}
.task-in-title, .task-out-title {
  padding: 5px 30px;
  font-size: 0.9em;
  font-style: italic;
  font-weight: bold;
}
.task-in, .task-out {
  padding: 5px 10px;
  font-size: 0.9em;
}
.task-container, .task-solve-container {
  max-width: 600px;
  margin: 0 auto;
  text-align: center;
}
.task-container img, .task-solve-container img {
  max-width: 100%;
  width: auto;
  height: auto;
  border-radius: 5px;
  border: 1px dotted #333333;  
  object-fit: contain;   
}
.task-tests {
  padding: 10px;
  font-size: 0.9em;
  font-family: "Consolas", monospace;
  background-color: #f8f8ff;
}
.task-tests table {
  border-spacing: 5px;
}
.task-tests td {
  min-width: 30px;
  padding: 2px 3px;
  text-align: left;
  vertical-align: top;
}
.task-solve {
  padding: 5px;
}
.task-solve-title {
  padding: 7px;
  border-top: 1px dotted #333333;  
  font-size: 0.9em;
  font-style: italic;
  text-align: center;
  font-weight: bold;
}
.my-css-style {
  margin: 2px;
  border-top: 1px dotted #333333;
  background-color: #f8f8ff;
  padding: 5px;
  font-size: 0.8em;
  line-height: 1.4;
}
input {
  margin: 2px 10px;
}
</style>

<!--================================-->
<body onload="Start(location.search)">

<div class="task-content">
  <div class="task-header">
    <div class="task-button" onclick="ShowItem(listBox.selectedIndex - 1)">&#9668;</div>
    <select id="listBox" size="1" onchange="ShowItem(this.selectedIndex)"></select>
    <div class="task-button"onclick="ShowItem(listBox.selectedIndex + 1)">&#9658;</div>
  </div>

  <div class="task-main">
    <div class="task-title"><span class="task-number" id="taskNumber"></span><span class="task-name" id="taskName"></span></div>
    <div id="taskText" class="task-text"></div>
    <div id="taskHint" class="task-hint"></div>
    <div class="task-container"><img id="taskImage" src="" alt=""></div>
  </div>

  <div class="task-in-out">
    <div id="taskInTitle" class="task-in-title">Дано:</div>
    <div id="taskIn" class="task-in"></div>
    <div id="taskOutTitle" class="task-out-title">Результат:</div>
    <div id="taskOut" class="task-out"></div>
  </div>

  <div id="taskTests" class="task-tests">Тести</div>
  <div id="taskSolveTitle" class="task-solve-title">
    <label><input type="checkbox" id="taskIsSolve" onclick="ViewSolve()"> Розв'язок </label>
  </div>
  <div id="taskSolve" class="task-solve">
    <div class="task-solve-container"><img id="taskSolveImage" src="" alt=""></div>
    <div class="my-css-style">
      Для красивого вигляду першим рядком запишіть:<br>
      &lt;link rel="stylesheet" href= "https://infobooks.github.io/task.css"&gt;<br><br>
      Код вводьте у&nbsp;<b>Блокноті</b> і перший&nbsp;раз <b><i>Збережіть&nbsp;як</i></b>&nbsp;&nbsp;=>&nbsp;&nbsp;Задача.html<br>
      АБО онлайн-сервіс <b>jsfiddle.net</b> чи&nbsp;інші. 
    </div>
  </div>

</div>

</body>

<!--================================-->
<script>
var startX, startY;
var myList = document.getElementById('listBox');
var myNumber = document.getElementById('taskNumber');
var myName = document.getElementById('taskName');
var myText = document.getElementById('taskText');
var myIn = document.getElementById('taskIn');
var myInTitle = document.getElementById('taskInTitle');
var myOut = document.getElementById('taskOut');
var myOutTitle = document.getElementById('taskOutTitle');
var myTests = document.getElementById('taskTests');
var myHint = document.getElementById('taskHint');
var myImage = document.getElementById('taskImage');
var mySolve = document.getElementById('taskSolve');
var myIsSolve = document.getElementById('taskIsSolve');
var mySolveTitle = document.getElementById('taskSolveTitle');
var mySolveImage = document.getElementById('taskSolveImage');

var n = 0;
const JS_FOLDER = 'javascript/';
  
//-------------------------------------
function Start(txt) {
  let s = '';
  for (let i = 0; i < tasks.length; i++) {
    s += '<option>' + (i + 1) + ('solve' in tasks[i] ? '°' : '') + '</option>';
  }
  myList.innerHTML = s;
  
  const par = decodeURI(txt).trim().slice(1);
  n = (par.length > 0 && !isNaN(par) && Number.isInteger(Number(par))) ? Number(par) - 1 : 0;
  ShowItem(n);
}

//-------------------------------------
function ViewSolve() {
  if (myIsSolve.checked) {
    mySolveImage.src = JS_FOLDER + tasks[n].name + '+.png'
    mySolve.style.display = '';
  } else {
    mySolveImage.src = '';
    mySolve.style.display = 'none';
  }
}

//-------------------------------------
function ShowItem(num) {
  if (tasks.length === 0) return;
  n = num;
  if (n >= tasks.length) n = tasks.length - 1;
  if (n < 0) n = 0;

  let task = tasks[n];
  
    //-----------------
  myNumber.innerHTML = '№&nbsp;' + (n + 1) + '.';
  myName.innerHTML = task.name ?? '-';
  if ('noView' in task) {
    myText.innerHTML = '';
    myText.style.display = 'none';  
    myIn.innerHTML = '';
    myIn.style.display = 'none';
    myInTitle.style.display = 'none';
    myOut.innerHTML = '';
    myOut.style.display = 'none';
    myOutTitle.style.display = 'none';
    myTests.innerHTML = '';
    myTests.style.display = 'none';
    myHint.innerHTML = '';
    myHint.style.display = 'none';
    myImage.src = '';
    myImage.style.display = 'none';
    mySolveImage.src = '';
    mySolve.style.display = 'none';
  } else {

    if ('text' in task) {
      myText.innerHTML = task.text;
      myText.style.display = '';
    } else {
      myText.innerHTML = '';
      myText.style.display = 'none';
    }
    if ('inTitle' in task) {
      myIn.innerHTML = task.inTitle.map((num, index) => `${index + 1}) ${num}`).join('<br>');
      myIn.style.display = '';
      myInTitle.style.display = '';
    } else {
      myIn.innerHTML = '';
      myIn.style.display = 'none';
      myInTitle.style.display = 'none';
    } 
    if ('outTitle' in task) {
      myOut.innerHTML = task.outTitle.map((num, index) => `${index + 1}) ${num}`).join('<br>');
      myOut.style.display = '';
      myOutTitle.style.display = '';
    } else {
      myOut.innerHTML = '';
      myOut.style.display = 'none';
      myOutTitle.style.display = 'none';
    }
    if ('tests' in task) {
      myTests.innerHTML = '<table>' + task.tests.map(row => '<tr>' + 
        row.map(item => `<td>${item}</td>`).join('') + '</tr>').join('') + '</table>';
      myTests.style.display = '';
    } else {
      myTests.innerHTML = '';
      myTests.style.display = 'none';
    }
    if ('hint' in task) {
      myHint.innerHTML = '(підказка: ' + task.hint + ')';
      myHint.style.display = '';
    } else {
      myHint.innerHTML = '';
      myHint.style.display = 'none';
    }
    if ('img' in task) {
      myImage.src = JS_FOLDER + task.name + '.png';
      myImage.style.display = '';
    } else {
      myImage.src = '';
      myImage.style.display = 'none';
    }
    myIsSolve.checked = false;
    mySolveImage.src = '';
    mySolve.style.display = 'none';    
    if ('solve' in task) {
      mySolveTitle.style.display = '';
    } else {
      mySolveTitle.style.display = 'none';
    }
  }
  
  myList.selectedIndex = n;
}

//-------------------------------------
function touchStart() {
  startX = event.touches[0].clientX;
  startY = event.touches[0].clientY;
}
function touchEnd(n) {
  let dX = event.changedTouches[0].clientX - startX;
  let dY = event.changedTouches[0].clientY - startY;
  if (dX > 50 && Math.abs(dX) > Math.abs(dY)) ShowItem(n - 1);
  if (dX < -50 && Math.abs(dX) > Math.abs(dY)) ShowItem(n + 1);
}

//=====================================
const tasks = [   //    « »   ’   &nbsp;–

/* діап */ {name:'Бобровиця', text: 'Бабуся Марічки живе у&nbsp;Бобровиці. До&nbsp;якого типу належить цей населений пункт, якщо відома кількість жителів у&nbsp;ньому?<br><span class="task-hint">до&nbsp;10&nbsp;000&nbsp;жителів&nbsp;– село<br>від&nbsp;10&nbsp;000&nbsp; до&nbsp;1&nbsp;000&nbsp;000&nbsp;жителів&nbsp;– місто<br>більше 1&nbsp;000&nbsp;000&nbsp;жителів&nbsp;– мегаполіс</span>',
  inTitle: ['кількість жителів у Бобровиці'],
  outTitle: ['тип населеного пункту'],
  solve:true,
  tests: [
    [8560, '==>', 'село'],
    [12000, '==>', 'місто'],
    [1234500, '==>', 'мегаполіс'], 
    [850678, '==>', 'місто'],  
  ]},

/* цикл */ {name:'Зерно', text:'Кожен день Микола завозить на&nbsp;склад 100&nbsp;кг зерна. Але третину постійно з’їдають миші. Виведіть, як змінювалась вага зерна на&nbsp;складі на&nbsp;протязі <b>N</b>&nbsp;днів.',
  inTitle: ['к-ть днів'],
  outTitle: ['<b>N</b>&nbsp;чисел&nbsp;– вагу зерна кожного дня<br>+ виведіть у&nbsp;стовпчик<br>+ допишіть номер дня і «кг»'],
  solve:true,
  tests: [
    ['5', '==>', '1.&nbsp;133.33 кг<br>2.&nbsp;144.44 кг<br>3.&nbsp;148.15 кг<br>4.&nbsp;149.38 кг<br>5.&nbsp;149.79 кг'],
  ]},

/* масив */ {name:'Поїзд-1', text:'На&nbsp;залізничну станцію прибув пасажирський поїзд з&nbsp;кількома вагонами. Микола знає кількість пасажирів у&nbsp;кожному вагоні.',
  inTitle: ['масив чисел&nbsp;– к-ть пасажирів у&nbsp;вагонах'],
  outTitle: ['к-ть пасажирів у 2-му&nbsp;вагоні', 'к-ть вагонів', 'к-ть пасажирів у&nbsp;кожному вагоні<br>+ виведіть у&nbsp;стовпчик<br>+ допишіть «пас.»'],
  solve:true,
  tests: [
    ['4  13  7  55', '==>', '13', '4', '4&nbsp;пас.<br>13&nbsp;пас.<br>7&nbsp;пас.<br>55&nbsp;пас.'],
    ['3  1', '==>', '1', '2', '3&nbsp;пас.<br>1&nbsp;пас.'],
  ]},

/* масив */ {name:'Поїзд-2', text:'На&nbsp;залізничну станцію прибув пасажирський поїзд з&nbsp;кількома вагонами. Микола знає кількість пасажирів у&nbsp;кожному вагоні.<br>а) Усі пасажири 2-го і 5-го вагона вийшли прогулятись.<br>б) Чверть пасажирів 3-го вагона перейшла в інший вагон.<br>в) Начальник поїзда каже, що місяць тому вагонів було у 3&nbsp;рази більше.',
  inTitle: ['масив чисел&nbsp;– к-ть пасажирів у&nbsp;вагонах'],
  outTitle: ['к-ть пасажирів, що вийшли прогулятись', 'к-ть пасажирів, що залишились у 3-му вагоні', 'к-ть вагонів, яка була місяць тому.', 'к-ть пасажирів у передостанньому вагоні'],
  tests: [
    ['12  27  16  8  1  9  3', '==>', '28', '12', '21', '9'],
    ['3  1  9  0  8', '==>', '9', '6.75', '12', '0'],
  ]},

/* масив */ {name:'Поїзд-3', text:'На&nbsp;залізничну станцію прибув пасажирський поїзд з&nbsp;кількома вагонами. Микола знає кількість пасажирів у&nbsp;кожному вагоні. Його цікавить, у якому з вагонів – 1-му чи 4-му – більше пасажирів?',
  inTitle: ['масив чисел&nbsp;– к-ть пасажирів у&nbsp;вагонах'],
  outTitle: ['у&nbsp;якому вагоні більше пасажирів'],
  tests: [
    ['2  27  16  8', '==>', 'У 4-му'],
    ['3  1  9  0  8', '==>', 'У 1-му'],
    ['10  4  12  10  5  9', '==>', 'Порівну'],    
  ]},

/* масив */ {name:'Фірма-1', text:'Микола працює у фірмі «Сонечко» і знає початкові доходи фірми за останні кілька місяців. Але спонсори подвоювали усі гроші. Як тепер «виглядають» доходи?',
  inTitle: ['масив чисел&nbsp;– початкові доходи фірми'],
  outTitle: ['масив чисел&nbsp;– теперішні доходи фірми<br>+ допишіть «грн» і номер місяця<br>+ виведіть доходи тільки з 2-го по 5-ий місяць'],
  solve:true,
  tests: [
    ['4  2  7  1  5  13  12  7  11', '==>', '4&nbsp;грн  14&nbsp;грн  2&nbsp;грн  10&nbsp;грн'],
    ['3  1  0  100  34  9', '==>', '2&nbsp;грн  0&nbsp;грн  200&nbsp;грн  68&nbsp;грн'],
  ]},
    
/* масив */ {name:'Фірма-2', text:'Микола працює у фірмі «Сонечко» і знає початкові доходи фірми за останні кілька місяців. Хакери «вкрали» усі доходи за останні кілька місяців. Як тепер «виглядають» доходи?',
  inTitle: ['масив чисел&nbsp;– початкові доходи фірми', 'місяць, після якого усі доходи зникли'],
  outTitle: ['масив чисел&nbsp;– теперішні доходи фірми'],
  tests: [
    ['12  27  6  8  1  9  3', '<b>3</b>', '==>', '12  27  6  0  0  0  0'],
    ['7  9  9  11', '<b>3</b>', '==>', '7  9  9  0'],
    ['3  1  9  8', '<b>1</b>', '==>', '3  0  0  0'],
    ['5  5  8  9  10', '<b>5</b>', '==>', '5  5  8  9  10'],    
  ]},
    
/* масив */ {name:'Фірма-3', text:'Микола працює у фірмі «Сонечко» і знає початкові доходи фірми за останні кілька місяців. А як «виглядають» доходи за парні місяці?',
  inTitle: ['масив чисел&nbsp;– початкові доходи фірми'],
  outTitle: ['масив чисел&nbsp;– доходи фірми по парних місяцях'],
  tests: [
    ['12  27  6  8  1  9  3', '==>', '27  8  9'],
    ['3  1  9  0', '==>', '1  0'],
    ['25', '==>', ''],
  ]},
    


]

//-------------------------------------
</script>
