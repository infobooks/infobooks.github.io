<!DOCTYPE html>
<html lang="uk">
<meta charset="utf-8">
<meta name="viewport"content="width=device-width,initial-scale=1.0">
<title>Анімація - тести</title>

<!--================================-->
<style>
body {
  margin: 0;
  padding: 5px;
  font-family: "Arial", sans-serif;
  line-height: 2;
  color: #333333;
  background-color: #f5f4e5;
}
.page-header {
  position: fixed;
  top: 2px;
  left: 10px;
  width: 94%;
  max-width: 560px;
  padding: 2px;
  border-spacing: 0;
  border-radius: 5px;
  text-align: center;
  background-color: #8fbc8f;
}
.btn {
  overflow: hidden;
  margin: 0 2px;
  border: 1px solid #333333;
  border-radius: 5px;
  cursor: pointer;
}
.btn__exit-test {
  width: 30px;
  padding: 2px;
  font-weight: bold;
  background-color: #e2dfe0;
}
.btn__next-quest {
  width: 60px;
  padding: 2px;
  background-color: #d0ecf4;
}
.page-title {
  font-size: 1.2em;
}
select {
  min-width: 120px;
  padding: 2px 5px;
  border: 2px outset #333333;
  border-radius: 5px;
  font-size: 1em;
  background: linear-gradient(to bottom, #ffffff, #b0c4de, #ffffff);
}
.content {
  width: 96%;
  max-width: 560px;
  margin: 42px 0 20px 6px;
  border-spacing: 0;
  background-color: #f5f4e5;
  border: 1px dotted #333333;
}
.quest-num {
  margin: 0 10px 0 5px;
  font-weight: bold;
}
.quest-count {
  margin-left: 5px;
  font-size: 0.8em;
}
.test-quest {
  min-height: 48px;
  padding: 10px 10px 20px 10px;
  border: 1px inset #333333;
  line-height: 1.5;
  background-color: #f8f8ff;
}
.test-correct-count {
  font-size: 0.8em;
  line-height: 1.5;
  text-align: right;
}
.test-answer {
  padding: 12px 0;
  border-top: 1px dotted #333333;
  background-color: #ffffff;
  cursor: pointer;
}
.test-answer-num {
  margin: 2px;
  padding-left: 5px;
}
.test-answer input {
  padding-left: 5px;
}
.test-answer label {
  padding-left: 5px;
  cursor: pointer;
}
.test-obj {
  margin: 20px 6px 5px 6px;
}
.test-obj img {
  max-width: 480px;
  border: 1px dotted #333333;
}
.test-result {
  max-width: 560px;
  margin: 10px 5px;
  text-align: center;
}
.test-result-percent {
  padding-left: 20px;
  font-size: 1.5em;
  font-weight: bold;
}
.test-result-mark {
  width: fit-content;
  min-width: 120px;
  margin: 15px auto;
  padding: 0 10px;
  border: 2px outset #333333;
  font-size: 7em;
  font-weight: bold;
  line-height: 1.5;
  background-color: #ffffff;
}
@media screen and (min-width:30em) {
  .page-header {top: 10px; left: 10%;}
  .content {margin: 50px 0 20px 10%;}
  .test-obj {margin-left: 10%;}
  .test-quest {padding: 20px 10px; line-height: 1.7;}
}
</style>

<!--================================-->
<body onload="StartTest()"><table class="page-header"id="tests_header"><tr><td class="btn btn__exit-test"onclick="ExitTest()">x</td><td class="page-title"><span>№</span><span class="quest-num"id="questNum"></span><span class="quest-count" id="questCount"></span></td><td class="btn btn__next-quest"onclick="NextQuestion()">&#9658;&#9658;</td></tr></table><table class="content" id="testForm"><tr><td class="test-quest" id="quest"></td></tr><tr><td class="test-correct-count"id="correctCount"></td></tr><tr><td class="test-answer"id="answer0"onclick="CheckAnswer(0)"><span class="test-answer-num">1.</span><input id="radio0"type="radio"name="answers"><label id="label0"></label></td></tr><tr><td class="test-answer"id="answer1"onclick="CheckAnswer(1)"><span class="test-answer-num">2.</span><input id="radio1"type="radio"name="answers"><label id="label1"></label></td></tr><tr><td class="test-answer"id="answer2"onclick="CheckAnswer(2)"><span class="test-answer-num">3.</span><input id="radio2"type="radio"name="answers"><label id="label2"></label></td></tr><tr><td class="test-answer"id="answer3"onclick="CheckAnswer(3)"><span class="test-answer-num">4.</span><input id="radio3"type="radio"name="answers"><label id="label3"></label></td></tr><tr><td class="test-answer"id="answer4"onclick="CheckAnswer(4)"><span class="test-answer-num">5.</span><input id="radio4"type="radio"name="answers"><label id="label4"></label></td></tr><tr><td class="test-answer"id="answer5"onclick="CheckAnswer(5)"><span class="test-answer-num">6.</span><input id="radio5"type="radio"name="answers"><label id="label5"></label></td></tr></table><div class="test-obj"><img id="questImg"src=""alt=""></div><div class="test-result"id="resForm"hidden><div><span>Результат:</span><span class="test-result-percent"id="resPercent"></span></div><div class="test-result-mark"id="testMark"></div></div></body>

<!--================================-->
<script>
var test = {MinMark:1, MaxMark:4, Type:'view', Questions:[

{Text:"Виберіть формати зображень, які можуть містити анімацію.", mas:[
  "png", "gif ", "webp ", "jpg", "pdf"   ]},

{NotRnd:true, Text:"Виберіть fps для звичайної анімації на&nbsp;сайтах.", mas:[
  "2-5&nbsp;fps", "20-30&nbsp;fps ", "100-120&nbsp;fps", "500-700&nbsp;fps"   ]},

{Text:"Плавне перетворення одного об'єкта в&nbsp;інший.<br>Така анімація називається...", mas:[
  "твінінг", "скролінг", "морфінг ", "стрімінг"   ]},

{Text:"Прямокутник з анімаційною рекламою на&nbsp;сайтах&nbsp;- це...", mas:[
  "скін", "спам", "фрейм", "банер "   ]},

{Obj:'анімація-1.jpg', Text:"Як називається технологія створення анімації, показана на&nbsp;фото?", mas:[
  "«захоплення руху» ", "«ключові» кадри", "пластилінова анімація", "робототехніка"   ]},

{Text:"Якого виду анімації НЕ&nbsp;існує?", mas:[
  "пластилінова", "плетена ", "пісочна", "тіньова", "мальована"   ]},

{Text:"Несправжній рух об'єктів шляхом швидкої зміни кадрів з&nbsp;ними&nbsp;- це...", mas:[
  "презентація", "варпінг", "анімація ", "дизайн"   ]},
  
]}


//-------------------------------------
//-------------------------------------
var A = [];          // mix questions
var B = [];          // mix answers
var gOrderN = -1;    // order number task in User window: 1, 2, 3...
var gN = -1;         // real number in test
var pause = false;   // pause beetween select answer
var q;               // test.Questions[gN]
var qCount = test.Questions.length;
var globalRes = '';        // stringRes

//-------------------------------------
var myQuestCount = document.getElementById('questCount');
var myQuestNum = document.getElementById('questNum');
var myCorrectCount = document.getElementById('correctCount');
var myQuest = document.getElementById('quest');
var myQuestImg = document.getElementById('questImg');
var myTestsHeader = document.getElementById('tests_header');
var myTestForm = document.getElementById('testForm');
var myResForm = document.getElementById('resForm');
var myTestMark = document.getElementById('testMark');
var myResPercent = document.getElementById('resPercent')
var myRadios = document.querySelectorAll('input[type="radio"]');
var myAnswers = document.querySelectorAll('.test-answer');
var myLabels = document.querySelectorAll('label');

//-------------------------------------
function GetMixArray(size, mix) {
  let nums = Array.from({length: size}, (_, i) => i);
  if (mix) {
    for (let i = size - 1; i >= 0; i--) {
      let rndNum = Math.floor(Math.random() * (i + 1));
      [nums[i], nums[rndNum]] = [nums[rndNum], nums[i]];
    }
  }
  return nums;
}

//-------------------------------------
function GetSelectCount(n) {
  return test.Questions[n].Answers.filter(item => item.Select).length;
}
//-------------------------------------
function GetCorrectCount(n) {
  return test.Questions[n].Answers.filter(item => item.Correct).length;
}

//-------------------------------------
function StartTest() {
  test.MinMark ??= 1;
  test.MaxMark ??= 12;
  test.Type ??= 'control';
  for (let i = 0; i < test.Questions.length; i++) {
    test.Questions[i].Text ??= '---';
    test.Questions[i].NotRnd ??= false;
    test.Questions[i].Obj ??= '';
    test.Questions[i].Answers ??= [];
    for (let j = 0; j < test.Questions[i].mas.length; j++) {
      let c = test.Questions[i].mas[j].endsWith(' '); 
      let s = test.Questions[i].mas[j];
      if (c) s.slice(0, -1);
      test.Questions[i].Answers.push({Text:s, Correct:c, Select:false});
    }
  }
  globalRes += new Date().toLocaleString();
  globalRes += ' - ' + test.MinMark + '-' + test.MaxMark;
  globalRes += ' - ' + decodeURI(window.location.href) + '\n';

  myQuestCount.innerHTML = '(' + qCount + ' пит.)';
  A = GetMixArray(qCount, true);
  NextQuestion();
}

//-------------------------------------
function NextQuestion() {
  if (gOrderN >= 0) {
    globalRes += '- ' + q.Text + '\n';
    for (const ans of q.Answers) {
      if (ans.Select) globalRes += ans.Text + '\n';
    }
  }
  if (gOrderN >= qCount - 1) {
    ExitTest();
    return;
  }

  pause = false;
  gOrderN++;
  gN = A[gOrderN];
  q = test.Questions[gN];

  let answersCount = q.Answers.length;
  B = GetMixArray(answersCount, !q.NotRnd);

  myQuestNum.innerHTML = gOrderN + 1;
  myQuest.innerHTML = q.Text;
  myQuestImg.src = q.Obj;
  myQuestImg.hidden = q.Obj === '';

  let c = GetCorrectCount(gN);
  myCorrectCount.innerHTML = (c > 1) ? '(' + c + ' відповіді)' : '.';
  for (let i = 0; i <= 5; i++) {
    myRadios[i].type = (c > 1) ? 'checkbox' : 'radio';
    myRadios[i].checked = false;
    myAnswers[i].style.backgroundColor = '#ffffff';
    myAnswers[i].hidden = i >= answersCount;
    myLabels[i].innerHTML = i >= answersCount ? '' : q.Answers[B[i]].Text;
  }
}

//-------------------------------------
function CheckAnswer(num) {
  if (pause) return;

  let isSelect = !q.Answers[B[num]].Select;
  myRadios[num].checked = isSelect;
  myAnswers[num].style.backgroundColor = isSelect ? '#fffff0' : '#ffffff';

  q.Answers[B[num]].Select = isSelect;
  if (GetSelectCount(gN) >= GetCorrectCount(gN)) {
    pause = true;
    if (test.Type === 'repeat') {
      for (let i = 0; i < q.Answers.length; i++) {
        if (q.Answers[B[i]].Correct) myAnswers[i].style.backgroundColor = '#98fb98';
        if (q.Answers[B[i]].Select && !q.Answers[B[i]].Correct) myAnswers[i].style.backgroundColor = '#ffb6c1';
      }
      setTimeout(NextQuestion, 2000);
    } else {
      setTimeout(NextQuestion, 400);
    }
  }
}

//-------------------------------------
function ExitTest() {
  myTestsHeader.style.display = 'none';
  myTestForm.style.display = 'none';
  myQuestImg.src = '';
  myQuestImg.hidden = true;
  myResForm.hidden = false;
  
  let p = GetPointsPercent();
  let m = GetMark(p);
  test.Type === 'control' ? SaveToFile(p, m) : ViewRes(p, m);
}

// - - - - - - - - - - - - - - - - - - 
function GetPointsPercent() {
  let pointSum = 0;
  let wrongAnswersCount = 0;
  for (let i = 0; i < qCount; i++) {
    pointSum += CorrectSelectCount(i) / GetCorrectCount(i);
    wrongAnswersCount += WrongSelectCount(i);
  }
  pointSum -= wrongAnswersCount * GetPenaltyPoint();
  return 100 * pointSum / qCount;
}
function CorrectSelectCount(n) {
  return test.Questions[n].Answers.filter(item => item.Select && item.Correct).length;
}
function WrongSelectCount(n) {
  return test.Questions[n].Answers.filter(item => item.Select && !item.Correct).length;
}
function GetPenaltyPoint() {
  let numerator = 0;
  let denominator = 0;
  let statMinus = 0;
  for (let i = 0; i < qCount; i++) {
    statMinus = MFromN(GetSelectCount(i) - 1, test.Questions[i].Answers.length - 1);
    numerator += statMinus;
    denominator += (test.Questions[i].Answers.length - GetCorrectCount(i)) * statMinus;
  }
  return denominator === 0 ? 0 : numerator / denominator;
}
function MFromN(m, n) {
  if (m < 0 || m > n) return 0;
  return factorial(n) / (factorial(m) * factorial(n - m));
}
function factorial(n) {
  let result = 1;
  for (let i = 2; i <= n; i++) {
    result *= i;
  }
  return result;
}
// - - - - - - - - - - - - - - - - - - 
function GetMark(markPercent) {
  if (test.MinMark < 0 || test.MaxMark < 0 || test.MinMark >= test.MaxMark) return -1;
  if (markPercent > 100) markPercent = 100;
  if (markPercent < 0) markPercent = 0;
  let oneMarkStep = 100 / (test.MaxMark - test.MinMark);
  let isMarkWithPlus = test.MaxMark <= 9;
  if (isMarkWithPlus) oneMarkStep /= 2;
  let mark = markPercent > 0 ? Math.floor(Math.abs(markPercent / oneMarkStep - 0.00001)) + 1 : 0;
  let res = test.MinMark + mark;
  if (isMarkWithPlus) {
    res = test.MinMark + Math.floor(mark / 2);
    if (mark % 2 === 1) return String(res) + '+';
  }
  return String(res);
}
// - - - - - - - - - - - - - - - - - - 
function SaveToFile(p, m) {
  myResPercent.innerHTML = 'Кінець тестування';
  globalRes += '73-0+149' + m + '94+132+435-6149' + Math.round(p) + '94+24359-310+';
  try {
    const blob = new Blob([globalRes], {type:'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'res.dtn';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  } catch(error) {
    alert('Помилка! Результат не збережено :(');
    return false;
  }
  return true;
}
// - - - - - - - - - - - - - - - - - - 
function ViewRes(p, m) {
  let choiceCount = Array.from({length: qCount}, (_, i) => GetSelectCount(i)).filter(res => res > 0).length;
  if (choiceCount < 0.75 * qCount) {
    myResPercent.innerHTML = 'Замало запитань для оцінки :(';
    return;
  }
  myResPercent.innerHTML = (p < 0) ? '< 0&nbsp;%' : Math.round(p) + '&nbsp;%';
  myTestMark.innerHTML = m;
  let s = '#c0c0c0';
  if (p > 14) s = '#ff69b4';
  if (p > 28) s = '#ffa07a';
  if (p > 43) s = '#ffd700';
  if (p > 57) s = '#7fffd4';
  if (p > 71) s = '#00ff7f';
  if (p > 85) s = '#00ff00';
  myTestMark.style.backgroundColor = s;
}

//-------------------------------------
</script>
